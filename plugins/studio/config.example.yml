# Optional Studio native-subagent spawn and execution policy.
# Copy to the consumer workspace root as `.studio.yml`.
# Blank values inherit from the next layer and ultimately the host session.
#
# Resolution, most to least specific:
#   explicit override > provider role > common role
#   > provider defaults > common defaults > host session inheritance.
#
# Model and effort identifiers are owned by each provider. Studio preserves the
# configured strings and passes the resolved pair to the host; it does not claim
# that every provider supports every combination.
#
# Commands are host-catalog skill identifiers, not shell strings. The values
# below are user-policy examples, not a built-in Studio plugin map. `auto` is a
# preferred candidate whose public description must match the mission.

execute:
  work:
    command: task-worker:define
    activation: auto
    fallback: native
  review:
    command: session-review:request-review
    activation: auto
    fallback: native
  delivery:
    command: task-github:done
    enabled: false
    fallback: skip

defaults:
  model:
  effort:

roles:
  architect:
    model:
    effort:
  dev:
    model:
    effort:
  qa:
    model:
    effort:
  reviewer:
    model:
    effort:

providers:
  codex:
    defaults:
      model:
      effort:
    roles:
      architect:
        model:
        effort:
      dev:
        model:
        effort:
      qa:
        model:
        effort:
      reviewer:
        model:
        effort:
  claude:
    defaults:
      model:
